spring:
  application:
    name: yes-diary-spring
  
  datasource:
    url: jdbc:mysql://localhost:3306/diary_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: diary_user
    password: diary_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080

logging:
  level:
    com.example: DEBUG
    org.springframework.web: DEBUG
