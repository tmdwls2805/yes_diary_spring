version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: diary-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: diary_db
      MYSQL_USER: diary_user
      MYSQL_PASSWORD: diary_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - diary-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diary-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/diary_db?characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: diary_user
      SPRING_DATASOURCE_PASSWORD: diary_password
    volumes:
      - ./src:/app/src
      - ./build:/app/build
      - gradle-cache:/root/.gradle
    command: gradle bootRun --no-daemon
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - diary-network

volumes:
  mysql-data:
  gradle-cache:

networks:
  diary-network:
    driver: bridge
